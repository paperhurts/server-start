[package]
name = "server-start"
version = "0.3.0"
edition = "2021"
build = "build.rs"

[dependencies]
tray-icon = "0.19"
winit = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"

# Hide the console window on Windows release builds; winreg for the
# HKCU Run-key toggle that backs "Start with Windows"; IpHelper/WinSock
# for the TCP listener table behind external-server detection.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }
winreg = "0.52"

# build.rs renders the tray-icon RGBA blob and the exe .ico from
# assets/server-start-icon.svg at each target resolution; none of these
# are needed at runtime.
[build-dependencies]
resvg = "0.44"
ico = "0.4"
winresource = "0.1"

[[bin]]
name = "server-start"
path = "src/main.rs"
